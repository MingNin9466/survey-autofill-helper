<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>示例问卷 · 校园活动报名</title>
<style>
  :root { --brand:#2563eb; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    font: 15px/1.7 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #eef4ff 0%, #f8fafc 45%, #eefaf6 100%);
    padding: 40px 20px 80px;
  }
  .card {
    max-width: 820px; margin: 0 auto; background: #fff; border-radius: 16px;
    box-shadow: 0 18px 50px rgba(30, 64, 175, .10); overflow: hidden;
  }
  .head { padding: 34px 40px 22px; border-bottom: 1px solid var(--line); background: #fbfdff; }
  .head h1 { margin: 0 0 10px; font-size: 24px; letter-spacing: .5px; }
  .head p { margin: 0; color: var(--muted); font-size: 13.5px; }
  .meta { display: flex; gap: 18px; margin-top: 14px; font-size: 12.5px; color: #64748b; }
  .body { padding: 8px 40px 26px; }
  .question-item { padding: 22px 0 18px; border-bottom: 1px dashed #eef1f5; }
  .question-item:last-child { border-bottom: none; }
  .question-title { font-weight: 600; margin-bottom: 14px; }
  .question-title i { color: #ef4444; font-style: normal; margin-right: 6px; }
  .question-title small { color: #9ca3af; font-weight: 400; margin-left: 8px; }
  .opts label {
    display: inline-flex; align-items: center; gap: 8px; min-width: 150px;
    padding: 9px 14px; margin: 0 10px 10px 0; border: 1px solid var(--line);
    border-radius: 9px; cursor: pointer; transition: .15s;
  }
  .opts label:hover { border-color: #93c5fd; background: #f8fbff; }
  .opts input { accent-color: var(--brand); }
  input[type=text], textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px;
    font: inherit; color: inherit; background: #fff;
  }
  textarea { min-height: 84px; resize: vertical; }
  .submit-row { padding: 18px 40px 34px; text-align: center; }
  .submit {
    min-width: 180px; padding: 11px 28px; border: none; border-radius: 9px; cursor: pointer;
    background: var(--brand); color: #fff; font-size: 15px; font-weight: 600;
    box-shadow: 0 8px 20px rgba(37, 99, 235, .28);
  }
  .submit:hover { background: #1d4ed8; }
  .foot { max-width: 820px; margin: 16px auto 0; text-align: center; color: #9ca3af; font-size: 12px; }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <h1>2026 秋季校园活动报名（示例问卷）</h1>
      <p>本页仅用于演示浏览器助手的自动填表效果，不是真实问卷，提交按钮不会发送任何数据。</p>
      <div class="meta"><span>约 1 分钟</span><span>匿名填写</span><span>示例数据</span></div>
    </div>
    <div class="body">
      <div class="question-item">
        <div class="question-title"><i>*</i>1. 你的姓名<small>单选填空</small></div>
        <input type="text" placeholder="请输入真实姓名">
      </div>
      <div class="question-item">
        <div class="question-title"><i>*</i>2. 你的性别</div>
        <div class="opts">
          <label><input type="radio" name="gender" value="m"> 男</label>
          <label><input type="radio" name="gender" value="f"> 女</label>
        </div>
      </div>
      <div class="question-item">
        <div class="question-title"><i>*</i>3. 你的年级</div>
        <div class="opts">
          <label><input type="radio" name="grade" value="1"> 大一</label>
          <label><input type="radio" name="grade" value="2"> 大二</label>
          <label><input type="radio" name="grade" value="3"> 大三</label>
          <label><input type="radio" name="grade" value="4"> 大四</label>
        </div>
      </div>
      <div class="question-item">
        <div class="question-title"><i>*</i>4. 你感兴趣的活动<small>多选</small></div>
        <div class="opts">
          <label><input type="checkbox" name="hobby" value="volunteer"> 志愿服务</label>
          <label><input type="checkbox" name="hobby" value="lecture"> 学术讲座</label>
          <label><input type="checkbox" name="hobby" value="sports"> 文体活动</label>
          <label><input type="checkbox" name="hobby" value="practice"> 社会实践</label>
        </div>
      </div>
      <div class="question-item">
        <div class="question-title">5. 你的建议<small>选填</small></div>
        <textarea placeholder="选填，可写活动建议"></textarea>
      </div>
    </div>
    <div class="submit-row">
      <button class="submit" type="button" onclick="alert('示例页：不会真的提交')">提交</button>
    </div>
  </div>
  <div class="foot">Demo page for the userscript screenshots · 与任何真实问卷无关</div>
</body>
</html>
